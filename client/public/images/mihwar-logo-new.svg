<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071836" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>

    <!-- Ocean Blue / Cyan Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Sunset Coral Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="50%" stop-color="#ff5e62" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />

  <!-- Outer Orbital Ring (Letter Meem / The Pivot Axis) -->
  <path d="M 28,68 C 28,42 45,24 68,24 C 88,24 100,38 98,56 C 96,74 78,88 56,88 C 42,88 32,78 32,68 C 32,56 42,46 56,46 C 70,46 80,56 78,68" 
        fill="none" 
        stroke="url(#oceanGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glowEffect)" />

  <!-- Dynamic Spark & Radiant Horizon (The Upward Ascent) -->
  <path d="M 68,24 L 96,16" 
        fill="none" 
        stroke="url(#coralGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Radiant Core / The Spark (Coral Sun) -->
  <circle cx="56" cy="67" r="9" fill="url(#coralGrad)" filter="url(#glowEffect)" />
  <circle cx="56" cy="67" r="4" fill="#ffffff" />

  <!-- Subtle Accent Dots -->
  <circle cx="96" cy="16" r="4.5" fill="url(#coralGrad)" filter="url(#glowEffect)" />
</svg>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز قيادة منصة مِحور | MIHWAR Master Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      background: #020b0a;
      color: #f3efe6;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .golden-title {
      background: linear-gradient(135deg, #ffffff 15%, #fef08a 55%, #f59e0b 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-bar {
      background: rgba(5, 24, 21, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(45, 212, 191, 0.25);
    }
    .nav-tab {
      color: #a7f3d0;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .nav-tab:hover {
      color: #ffffff;
      background: rgba(13, 91, 85, 0.4);
      border-color: rgba(45, 212, 191, 0.3);
    }
    .nav-tab.active {
      color: #ffffff;
      background: linear-gradient(135deg, #0d5b55, #14b8a6);
      border-color: rgba(94, 234, 212, 0.5);
      box-shadow: 0 0 16px rgba(20, 184, 166, 0.4);
    }
    .device-btn {
      color: #cbd5e1;
      border: 1px solid rgba(45, 212, 191, 0.2);
      transition: all 0.2s;
    }
    .device-btn:hover {
      color: #ffffff;
      border-color: #2dd4bf;
    }
    .device-btn.active {
      color: #041210;
      background: #2dd4bf;
      border-color: #5eead4;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.5);
    }
    .iframe-wrapper {
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="selection:bg-[#2dd4bf] selection:text-[#041210]">

  <!-- Top Executive Navigation Bar -->
  <header class="top-bar flex-none px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 z-50">
    
    <!-- Logo & Hub Status -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0d5b55] to-[#14b8a6] text-white flex items-center justify-center font-extrabold text-xl shadow-lg border border-[#2dd4bf]/40">
        <svg width="22" height="22" viewBox="0 0 44 44" fill="none"><path d="M8 30.5C8 18.7 14.5 9 22 9s14 9.7 14 21.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/><path d="M13.5 31c1.1-6.7 4.1-11 8.5-11s7.4 4.3 8.5 11" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/><circle cx="22" cy="31.5" r="3.5" fill="#fef08a"/><path d="M22 35v4" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl font-black tracking-tight text-white block leading-none">مِحور</span>
          <span class="text-[9px] bg-[#10b981]/25 text-[#6ee7b7] px-2 py-0.5 rounded-full border border-[#10b981]/40 font-bold">جاهز للإطلاق 🟢</span>
        </div>
        <span class="text-[9px] font-bold tracking-[0.24em] text-[#a7f3d0] uppercase">MASTER CONTROL HUB</span>
      </div>
    </div>

    <!-- Page Switcher Tabs -->
    <nav class="flex items-center gap-1.5 overflow-x-auto py-1 px-2 bg-[#041412] border border-[#2dd4bf]/20 rounded-2xl max-w-2xl text-xs font-bold">
      <button onclick="switchPage('hero_preview.html', this)" class="nav-tab active px-3.5 py-1.5 rounded-xl cursor-pointer">
        🌟 الرئيسية وذكاء AI
      </button>
      <button onclick="switchPage('breakthroughs_and_courses.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer text-amber-300 border border-amber-400/40 bg-amber-500/10">
        ⚡ انفرادات ومحاكاة قوانين & AI
      </button>
      <button onclick="switchPage('interactive_walkthrough_guide.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        🚀 العرض التقديمي الشامل
      </button>
      <button onclick="switchPage('teachers_directory_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        👥 دليل المعلمين
      </button>
      <button onclick="switchPage('teacher_profile_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        👨‍🏫 ملف المعلم والحجز
      </button>
      <button onclick="switchPage('library_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        📚 المكتبة الرقمية (PDF)
      </button>
      <button onclick="switchPage('summaries_catalog_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        📖 ملخصات الـ 16 مادة
      </button>
      <button onclick="switchPage('parent_dashboard_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        👨‍👩‍👧‍👦 لوحة ولي الأمر
      </button>
      <button onclick="switchPage('teacher_portal_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        🎓 بوابة المعلم
      </button>
      <button onclick="switchPage('admin_dashboard_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        🛡️ غرفة الإدارة
      </button>
      <button onclick="switchPage('classroom_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        💻 الغرفة الصفية المباشرة
      </button>
      <button onclick="switchPage('curricula_guide_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        🗺️ المناهج والمسارات
      </button>
      <button onclick="switchPage('teacher_apply_preview.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        📝 تقديم المعلمين
      </button>
      <button onclick="switchPage('teacher_teaser_poster.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        📢 البوستر التشويقي
      </button>
      <button onclick="switchPage('privacy_policy.html', this)" class="nav-tab px-3.5 py-1.5 rounded-xl cursor-pointer">
        🛡️ سياسة الخصوصية
      </button>
    </nav>

    <!-- Responsive Device Switcher & Open Tab Button -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-[#041412] border border-[#2dd4bf]/20 p-1 rounded-xl text-xs">
        <button onclick="setDevice('full', this)" class="device-btn active px-2.5 py-1 rounded-lg cursor-pointer flex items-center gap-1" title="عرض كامل (Desktop)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <span class="hidden sm:inline">حاسوب</span>
        </button>
        <button onclick="setDevice('tablet', this)" class="device-btn px-2.5 py-1 rounded-lg cursor-pointer flex items-center gap-1" title="جهاز لوحي (Tablet 768px)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          <span class="hidden sm:inline">تابلت</span>
        </button>
        <button onclick="setDevice('mobile', this)" class="device-btn px-2.5 py-1 rounded-lg cursor-pointer flex items-center gap-1" title="هاتف ذكي (Mobile 390px)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          <span class="hidden sm:inline">هاتف</span>
        </button>
      </div>

      <a id="externalLink" href="hero_preview.html" target="_blank" class="bg-[#082622] hover:bg-[#0d3b35] text-[#2dd4bf] border border-[#2dd4bf]/40 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition" title="فتح في لسان مستقل">
        <span>فتح بملء الشاشة</span>
        <svg class="w-3.5 h-3.5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </a>
    </div>

  </header>

  <!-- Interactive Live Viewport Container -->
  <main class="flex-1 w-full bg-[#020908] flex items-center justify-center p-2 sm:p-4 overflow-hidden relative">
    <div id="frameWrapper" class="iframe-wrapper w-full h-full rounded-2xl overflow-hidden border border-[#2dd4bf]/30 shadow-[0_20px_60px_rgba(0,0,0,0.8)] bg-[#041210]">
      <iframe id="mainFrame" src="hero_preview.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    function switchPage(url, btn) {
      document.getElementById("mainFrame").src = url;
      document.getElementById("externalLink").href = url;

      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      btn.classList.add("active");
    }

    function setDevice(mode, btn) {
      const wrapper = document.getElementById("frameWrapper");

      document.querySelectorAll(".device-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (mode === "full") {
        wrapper.style.width = "100%";
        wrapper.style.height = "100%";
        wrapper.style.maxWidth = "100%";
      } else if (mode === "tablet") {
        wrapper.style.width = "768px";
        wrapper.style.height = "95%";
        wrapper.style.maxWidth = "768px";
      } else if (mode === "mobile") {
        wrapper.style.width = "390px";
        wrapper.style.height = "844px";
        wrapper.style.maxWidth = "390px";
      }
    }
  </script>
</body>
</html>
